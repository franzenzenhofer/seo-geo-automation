name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy .
      - name: Tests
        run: pytest
      - name: Smoke run (no AI, no keys)
        run: python run.py --url https://example.com/ --no-ai --output-base smoke-output
      - name: Smoke report exists
        shell: bash
        run: |
          test -f smoke-output/example.com/*/report.html
          test -f smoke-output/example.com/*/full-report.json
